[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pubg-position-analyzer"
version = "0.1.0"
description = "Telemetry-first PUBG position value analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
pubg-analyzer = "pubg_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pubg_analyzer"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

