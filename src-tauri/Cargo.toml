[package]
name = "pubg-analyzer-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tauri desktop application for PUBG Analyzer"

[lib]
name = "pubg_analyzer_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "pubg-analyzer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
keyring = "4.2"
pubg-analyzer-core = { path = "../crates/pubg-analyzer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = [] }
tauri-plugin-shell = "2.3"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true
