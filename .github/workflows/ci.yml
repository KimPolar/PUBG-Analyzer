name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trainer/requirements.txt
      - run: npm ci
      - run: python -m pip install -r trainer/requirements.txt
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p pubg-analyzer-core --all-targets -- -D warnings
      - run: cargo test -p pubg-analyzer-core
      - run: npm run build
      - run: python -m unittest discover -s trainer -p "test_*.py"
        env:
          PYTHONPATH: trainer

  windows-bundle:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trainer/requirements.txt
      - run: npm ci
      - run: python -m pip install -r trainer/requirements.txt
      - run: npm run tauri:build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: pubg-analyzer-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
